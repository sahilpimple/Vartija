[project]
name = "vartija-core"
version = "0.2.0"
description = "Reusable regulatory-incident core: signed event intake, regulatory clock, approval gate, hash-chained audit log, cited AI assessment."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "sqlalchemy>=2.0",
  "pydantic>=2.5",
  "pyyaml>=6",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "uvicorn>=0.29"]
postgres = ["psycopg[binary]>=3.1"]
docs = ["pypdf>=4", "reportlab>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# config/, corpus/ and seed/ live next to the package in the repo; they are installed inside it
# (vartija_core/bundled_*) so a normal `pip install git+https://...` works, not only editable installs.
packages = ["vartija_core", "vartija_core.bundled_config", "vartija_core.bundled_corpus", "vartija_core.bundled_seed"]

[tool.setuptools.package-dir]
"vartija_core" = "vartija_core"
"vartija_core.bundled_config" = "config"
"vartija_core.bundled_corpus" = "corpus"
"vartija_core.bundled_seed" = "seed"

[tool.setuptools.package-data]
vartija_core = ["static/*.html"]
"vartija_core.bundled_config" = ["*.yaml", "regimes/*.yaml", "sectors/*.yaml", "prompts/*.md"]
"vartija_core.bundled_corpus" = ["*.md", "*.json"]
"vartija_core.bundled_seed" = ["*.yaml"]
