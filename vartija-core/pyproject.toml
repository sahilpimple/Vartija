[project]
name = "vartija-core"
version = "0.1.0"
description = "Reusable regulatory-incident core: signed event intake, regulatory clock, approval gate, hash-chained audit log, cited AI assessment."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "sqlalchemy>=2.0",
  "pydantic>=2.5",
  "pyyaml>=6",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "uvicorn>=0.29"]
postgres = ["psycopg[binary]>=3.1"]
docs = ["pypdf>=4", "reportlab>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vartija_core"]

[tool.setuptools.package-data]
vartija_core = ["static/*.html"]
